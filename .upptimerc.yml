owner: openwatersio
repo: status
user-agent: openwatersio
assignees: [bkeepers] # downtime issues are assigned, so they notify by email

sites:
  - name: AIS stream
    # 503 when the server's own loopback subscriber stops receiving events (the stream delivers nothing)
    url: https://ais.openwaters.io/health
  - name: AIS WebSocket
    check: ws
    url: wss://ais.openwaters.io/v1/stream
    body: '{"type":"subscribe","bbox":[[59,10,60,11]]}'
  - name: AIS vessels snapshot
    url: https://ais.openwaters.io/v1/vessels?bbox=59,10,60,11
  - name: AIS live map
    url: https://openwatersio.github.io/aiscast/
  - name: openwaters.io
    url: https://openwaters.io

status-website:
  cname: status.openwaters.io
  logoUrl: https://openwaters.io/favicon.svg
  name: Open Waters Status
  introTitle: "**Open Waters** service status"
  introMessage: Live status and uptime history for the [AIS stream](https://openwaters.io/ais/) and the rest of Open Waters. Checks run every five minutes from GitHub Actions; incidents are tracked as issues in the [status repository](https://github.com/openwatersio/status).
  navbar:
    - title: Status
      href: /
    - title: Open Waters
      href: https://openwaters.io
    - title: AIS API
      href: https://openwaters.io/api
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
